name: lobehub
services:
  # B 方案：仅启动 LobeChat，本地不再创建数据库 / Redis / 对象存储
  # 这些依赖通过 .env 提供外部连接（DATABASE_URL / REDIS_URL / S3_*）

  searxng:
    image: searxng/searxng
    container_name: lobe-searxng
    environment:
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_PORT=8080
      - SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml
    volumes:
      - './searxng-settings.yml:/etc/searxng/settings.yml'
    networks:
      - default
    restart: always

  lobe:
    image: lobehub-clean:v2.2.0
    container_name: lobehub
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${LOBE_PORT}:3210'
    env_file:
      - .env
    networks:
      - default
      - deploy_default
    depends_on:
      - searxng
    restart: always

networks:
  deploy_default:
    external: true
