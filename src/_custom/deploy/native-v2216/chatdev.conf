server {
    listen 80;
    server_name chatdev.cotticoffee.com;
    rewrite ^(.*)$ https://${server_name}$1 permanent;
}
server {
    listen       443 ssl;
    server_name  chatdev.cotticoffee.com;
    ssl_certificate /etc/nginx/certs/cotticoffee_com.crt;
    ssl_certificate_key /etc/nginx/certs/cotticoffee_com.key;
    access_log  /var/log/nginx/chatdev.access.log feixiang_timing;

    # Native v2.2.16 S3: preserve the signed request path and Host.
    location ~ ^/lobe(?:/|$) {
        add_header Content-Security-Policy "sandbox; default-src 'none';" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:19300;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /webapi/chat/ {
        proxy_pass    http://127.0.0.1:3230;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";

        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;

        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    location ^~ /trpc/ {
        proxy_pass    http://127.0.0.1:3230;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        gzip off;
        chunked_transfer_encoding off;
        proxy_buffering on;
        proxy_cache off;
        proxy_request_buffering on;
        add_header Cache-Control "no-cache, no-transform" always;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
    }

        location ~* ^/(?:_spa|_spa-auth)/(?:assets|i18n|vendor)/.*\.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|wasm|pdf)$ {
            proxy_pass    http://127.0.0.1:3230;
            proxy_http_version 1.1;
            proxy_intercept_errors on;
            error_page 404 = @chatdev_spa_static_404;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

            proxy_hide_header Cache-Control;
            proxy_hide_header CDN-Cache-Control;
            proxy_hide_header Vercel-CDN-Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header CDN-Cache-Control "public, max-age=31536000, immutable";
        }

        location @chatdev_spa_static_404 {
            internal;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header CDN-Cache-Control "no-store" always;
            add_header Vercel-CDN-Cache-Control "no-store" always;
            return 404;
        }

        location / {
        proxy_pass    http://127.0.0.1:3230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        # --- 建议补充以下三行，防止 AI 回复卡顿 ---
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        # ---------------------------------------
        # --- 超时设置（防止长对话中断） ---
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3230;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # --- 优化点：这里也需要 Host 头，否则 Next.js 可能会拦截连接 ---
        proxy_set_header Host $host;
        proxy_cache off; # HMR 绝对不能缓存
        proxy_buffering off;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
